# Production topology for Phase 0: postgres + redis (internal only, no host port exposure) +
# backend (no source bind-mount — runs the built image, multi-worker). No nginx — there is no
# built web/ app yet to reverse-proxy (web/ is a placeholder until its own phase, per the
# implementation plan). Add nginx back in whichever phase web/ actually ships, following
# SchoolAssist's docker-compose.prod.yml as the template at that point. Contrast with
# docker-compose.yml (dev): that one binds ports 5432/6379/8000 to the host and bind-mounts
# ./backend for live code sync; this one does neither, since nothing outside the Docker
# network should reach postgres/redis/backend directly in production, and the image should
# be immutable once built.
#
# Usage:
#   cp .env.prod.example .env.prod   # then fill in every value marked REQUIRED
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: zonovia
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env.prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres-init.prod.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://zonovia_app:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env.prod}@postgres:5432/zonovia
      DATABASE_URL_SYNC: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}@postgres:5432/zonovia
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env.prod}
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
      WEB_CONCURRENCY: ${BACKEND_WORKERS:-4}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
